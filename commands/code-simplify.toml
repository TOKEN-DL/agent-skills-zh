description = "简化代码以提升可读性与可维护性，在不改变行为的前提下降低复杂度"

prompt = """
调用 code-simplification Skill。

在保持行为完全一致的前提下，简化最近改动的代码（或指定范围）：

1. 读 AGENTS.md，研究项目约定
2. 确定目标代码，默认指最近改动，除非指定更宽的范围
3. 在动手前理解代码的用途、调用方、边界情况与测试覆盖
4. 扫描简化机会：
   - 深层嵌套 → 卫语句（guard clause）或抽取辅助函数
   - 过长函数 → 按职责拆分
   - 嵌套三元 → if / else 或 switch
   - 泛名 → 具描述性的命名
   - 重复逻辑 → 共享函数
   - 死代码 → 确认后删除
5. 增量应用每次简化，每次改动后跑测试
6. 验证全部测试通过、构建成功、diff 干净

若简化后测试失败，回退那一次改动并重新考虑。用 `code-review-and-quality` 复核结果。
"""