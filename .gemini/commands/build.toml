description = "增量实现，构建、测试、验证、提交。附加 \"auto\" 时一次性跑完整个计划。"

prompt = """
调用 incremental-implementation Skill，同时配合 test-driven-development。

## 模式

- `/build` ， 实现计划中"下一个"待办任务，然后停下（谨慎，一次只切一片）。
- `/build auto` ， 必要时生成计划、获得一次批准，然后连续实现每个任务，任务之间不暂停。

参数决定模式。把 `auto`（规范名）或 `all` 视为自动模式；其他（或空）为默认单任务模式。注意：自动模式并不是单任务跑得更快，它跑同一套 TDD 循环，它只是省去了任务之间的人工脚步。

## 默认：单任务

从计划中挑下一个待办任务，然后：

1. 读该任务的验收标准
2. 加载相关上下文（既有代码、模式、类型）
3. 为预期行为写一个失败测试（RED）
4. 写最少代码让测试通过（GREEN）
5. 跑完整测试套件，检查回归
6. 跑构建确认编译
7. 用一条描述性消息提交
8. 把任务标记为完成并停下

## 自动：整个计划（`/build auto`）

当 spec 已存在、想把 计划 + 构建 合并为一次运行时使用。它省去任务之间的人工脚步，不是省去校验。每个任务仍然要先跑出一个通过的测试和它自己的提交。

1. 要求存在 spec。仅在已知路径查 spec：仓库根 SPEC.md、docs/SPEC.md、spec/ 下的文件。README 或任意文档不算。如果没有，停下让用户先跑 /spec，不要自己编需求。
2. 建立干净的基线。跑 `git status --porcelain`。若预期外的策划产物（SPEC.md、docs/SPEC.md、spec/*、tasks/plan.md、tasks/todo.md）之外还有未提交改动，停下并让用户提交、暂存、或确认如何处理。自动的逐任务提交不能吞掉无关的本地工作，否则"干净回滚"保证就破了。
3. 若需要则制定计划。若 tasks/plan.md 不存在，调用 planning-and-task-breakdown Skill 生成。
4. 单一检查点。把完整计划展示出来，等待明确肯定（例如 "approve"、"go"、"yes"）。把含糊回应（"看着合理"、"我猜"）视为未批准。这是唯一的人工关卡；批准后即可自动运行。若你生成了 tasks/plan.md，现在就做一次预备提交，避免它混入第一个任务的提交。
5. 按依赖顺序执行每个任务。使用每个任务声明的依赖；若依赖不显式给出，则按计划列出的顺序执行。对每个任务，运行上面完整的默认循环（RED → GREEN → 回归 → 构建 → 提交 → 标记完成）。仅 stage 该任务改动过的文件及其任务状态更新，绝不要盲目 `git add -A`，并每任务做一次提交，使任意一点都能干净回滚。
6. 停下并询问用户（不要硬扛）当出现：
   - 测试怎么也跑不过、或构建莫名其妙地崩了 → 遵循 debugging-and-error-recovery Skill
   - spec 含糊、或任务需要的决策 spec 没覆盖
   - 任务高风险或不可逆，鉴权 / 权限变更、破坏性数据迁移、支付、删除、部署、任何触碰机密的、或任何你 `git revert` 撤不回来的事 → 遵循 doubt-driven-development Skill，并在继续前获得明确签字
   用户解决了阻塞后再次调用 /build auto，它会从下一个待办任务恢复。
7. 结束时总结：完成的任务、新增的测试、所做的提交，以及任何跳过、标记、或待用户决定的事项。

若任一步失败，遵循 debugging-and-error-recovery Skill。
"""